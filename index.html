<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Auth System</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #08070b;
            --card: #16121e;
            --border: rgba(255, 0, 60, 0.22);
            --primary: #ff003c;
            --text: #f3f3f8;
            --muted: #9591a6;
            --success: #00e676;
            --danger: #ff1744;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

            .btn-primary:hover {
                opacity: 0.8;
            }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .input {
            width: 100%;
            padding: 12px;
            background: #0a080f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #fff;
            outline: none;
            margin-bottom: 12px;
        }

            .input:focus {
                border-color: var(--primary);
            }

        /* Login */
        #login-view {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Dashboard */
        #dashboard-view {
            display: none;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 12px;
            color: var(--muted);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

            .status.active {
                background: rgba(0,230,118,0.1);
                color: var(--success);
                border: 1px solid var(--success);
            }

            .status.revoked {
                background: rgba(255,23,68,0.1);
                color: var(--danger);
                border: 1px solid var(--danger);
            }

        .code {
            font-family: 'Fira Code', monospace;
            color: #4ef0a5;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 6px;
            color: #fff;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- LOGIN VIEW -->
    <div id="login-view">
        <div class="glass login-box">
            <div style="font-size: 40px; color: var(--primary); margin-bottom: 10px;"><i class="fa-solid fa-skull"></i></div>
            <h2 style="margin-bottom: 20px;">Admin Login</h2>
            <input type="text" id="username" class="input" placeholder="Username">
            <input type="password" id="password" class="input" placeholder="Password">
            <button class="btn btn-primary" onclick="login()" style="width: 100%;">Login</button>
        </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view">
        <div class="header">
            <h2><i class="fa-solid fa-skull"></i> Bloody Auth Dashboard</h2>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>

        <div class="glass">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Authorized Systems</h3>
                <button class="btn btn-primary" onclick="openModal()">+ Register UUID</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>System UUID</th>
                        <th>Device Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dynamically filled -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:100;">
        <div class="glass" style="width:100%; max-width:400px;">
            <h3 style="margin-bottom:20px;">Register UUID</h3>
            <input type="text" id="new-uuid" class="input" placeholder="UUID (e.g. DBA83997...)">
            <input type="text" id="new-name" class="input" placeholder="Device Name">
            <button class="btn btn-primary" onclick="saveUuid()" style="width:100%;">Save</button>
            <button class="btn btn-secondary" onclick="closeModal()" style="width:100%; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let uuids = [];

        // Check if logged in
        if(localStorage.getItem('admin_session') === 'true') {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        loadData();
        }

        function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === 're4per' && p === 're4per123') {
        localStorage.setItem('admin_session', 'true');
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        loadData();
        } else {
        showToast('Invalid Credentials', 'danger');
        }
        }

        function logout() {
        localStorage.removeItem('admin_session');
        location.reload();
        }

        function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.background = type === 'danger' ? 'var(--danger)' : 'var(--success)';
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
        }

        // Load data from API, fallback to LocalStorage if API resets
        async function loadData() {
        try {
        const res = await fetch('/api/keys');
        if(res.ok) {
        const cloudData = await res.json();
        if (cloudData.length > 0) {
        uuids = cloudData;
        localStorage.setItem('bloody_backup', JSON.stringify(uuids));
        } else {
        // API is empty (server slept), load from browser backup
        const backup = localStorage.getItem('bloody_backup');
        if(backup) uuids = JSON.parse(backup);
        }
        }
        } catch(e) {
        const backup = localStorage.getItem('bloody_backup');
        if(backup) uuids = JSON.parse(backup);
        }
        renderTable();
        }

        function renderTable() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        if(uuids.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--muted);">No UUIDs registered. Add one above!</td></tr>';
        return;
        }
        uuids.forEach((item, idx) => {
        tbody.innerHTML += `
        <tr>
        <td class="code">${item.uuid}</td>
        <td>${item.user}</td>
        <td><span class="status ${item.status.toLowerCase()}">${item.status}</span></td>
        <td>
        <button class="btn btn-secondary" onclick="toggleStatus(${idx})" style="padding:4px 8px;">Toggle</button>
        <button class="btn btn-secondary" onclick="deleteUuid(${idx})" style="padding:4px 8px; color:var(--danger);">Delete</button>
        </td>
        </tr>
        `;
        });
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function saveUuid() {
        const uuid = document.getElementById('new-uuid').value.trim().toUpperCase();
        const name = document.getElementById('new-name').value.trim();
        if(!uuid || !name) return showToast('Fill all fields', 'danger');

        const idx = uuids.findIndex(x => x.uuid === uuid);
        const newObj = { uuid, user: name, status: 'Active' };

        if(idx !== -1) uuids[idx] = newObj;
        else uuids.unshift(newObj);

        await syncCloud();
        renderTable();
        closeModal();
        showToast('UUID Saved!');
        }

        async function toggleStatus(idx) {
        uuids[idx].status = uuids[idx].status === 'Active' ? 'Revoked' : 'Active';
        await syncCloud();
        renderTable();
        }

        async function deleteUuid(idx) {
        uuids.splice(idx, 1);
        await syncCloud();
        renderTable();
        }

        async function syncCloud() {
        localStorage.setItem('bloody_backup', JSON.stringify(uuids));
        try {
        await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save_all', keys: uuids })
        });
        } catch(e) { showToast('Saved locally (API Offline)', 'danger'); }
        }
    </script>
</body>
</html>
