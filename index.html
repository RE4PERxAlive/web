<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Auth System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #08070b; --bg-surface: #100e17; --bg-card: rgba(22, 18, 30, 0.75);
            --bg-card-border: rgba(255, 0, 60, 0.22); --primary: #ff003c; --primary-glow: rgba(255, 0, 60, 0.45);
            --primary-dark: #b3002a; --accent: #ff2a5f; --text-main: #f3f3f8; --text-muted: #9591a6;
            --text-dim: #5c5870; --success: #00e676; --warning: #ffab00; --danger: #ff1744;
            --radius-lg: 16px; --radius-md: 10px; --radius-sm: 6px; --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 15% 15%, rgba(255, 0, 60, 0.09) 0%, transparent 45%), radial-gradient(circle at 85% 85%, rgba(130, 0, 35, 0.09) 0%, transparent 45%); background-attachment: fixed; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: var(--bg-base); } ::-webkit-scrollbar-thumb { background: rgba(255, 0, 60, 0.35); border-radius: 4px; }
        .glass-panel { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--bg-card-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6); }

        /* Login */
        #auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { width: 100%; max-width: 460px; border-radius: var(--radius-lg); padding: 40px 32px; text-align: center; }
        .brand-logo { width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; box-shadow: 0 0 25px var(--primary-glow); margin-bottom: 12px; }
        .brand-title { font-size: 28px; font-weight: 800; background: linear-gradient(180deg, #fff 0%, #d1cddb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Forms */
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 14px; color: var(--text-dim); }
        .form-input { width: 100%; padding: 12px 14px 12px 42px; background: rgba(10, 8, 15, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius-md); color: var(--text-main); outline: none; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
        .form-input.no-icon { padding-left: 14px; }
        
        /* Buttons */
        .btn { padding: 12px 20px; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 20px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 0, 60, 0.6); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-save { background: linear-gradient(135deg, #00c853, #009624); color: #fff; box-shadow: 0 4px 15px rgba(0, 200, 83, 0.35); }

        /* Dashboard */
        #dashboard-container { display: none; flex-direction: column; min-height: 100vh; }
        .navbar { height: 70px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bg-card-border); background: rgba(12, 10, 18, 0.88); backdrop-filter: blur(12px); }
        .main-content { flex: 1; padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
        
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .card { border-radius: var(--radius-lg); padding: 24px; text-align: center; }
        
        /* Table */
        .table-responsive { overflow-x: auto; border-radius: var(--radius-lg); }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { background: rgba(18, 14, 26, 0.95); padding: 16px 20px; color: var(--text-muted); border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-transform: uppercase; font-size: 12px; }
        .data-table td { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); background: rgba(14, 11, 20, 0.5); }
        .data-table tr:hover td { background: rgba(255, 0, 60, 0.05); }
        .key-value { font-family: 'Fira Code', monospace; font-size: 14px; color: #4ef0a5; }
        .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-pill.active { background: rgba(0, 230, 118, 0.1); color: var(--success); border: 1px solid rgba(0, 230, 118, 0.3); }
        .status-pill.revoked { background: rgba(255, 23, 68, 0.1); color: var(--danger); border: 1px solid rgba(255, 23, 68, 0.3); }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-card { width: 100%; max-width: 500px; border-radius: var(--radius-lg); padding: 32px; }
        .icon-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-main); width: 36px; height: 36px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .icon-btn:hover { background: var(--primary); border-color: var(--primary); }
        
        #toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: var(--radius-md); color: #fff; display: none; z-index: 1000; border: 1px solid var(--primary); background: var(--bg-surface); }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="auth-container">
        <div class="glass-panel auth-card">
            <div class="brand-logo"><i class="fa-solid fa-skull"></i></div>
            <h1 class="brand-title">BLOODY AUTH</h1>
            <p style="color: var(--text-muted); margin-bottom: 25px;">System UUID Management</p>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="admin-user" class="form-input" placeholder="Admin Username">
                    <i class="fa-solid fa-user-gear input-icon"></i>
                </div>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="admin-pass" class="form-input" placeholder="Admin Password">
                    <i class="fa-solid fa-lock input-icon"></i>
                </div>
            </div>
            <button class="btn btn-primary" onclick="login()" style="width: 100%;">Login as Admin</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-container">
        <nav class="navbar">
            <div style="display: flex; align-items: center; gap: 14px;">
                <div class="brand-logo" style="width: 38px; height: 38px; font-size: 18px; margin: 0;"><i class="fa-solid fa-skull"></i></div>
                <div style="font-size: 20px; font-weight: 800;">BLOODY AUTH</div>
            </div>
            <button class="btn btn-secondary" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h2 style="font-size: 24px;">All Registered System UUIDs</h2>
                    <p style="color: var(--text-muted);">Manage machine authorization keys permanently.</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-save" onclick="syncCloud(true)"><i class="fa-solid fa-cloud-arrow-up"></i> Force Save</button>
                    <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Register New</button>
                </div>
            </div>

            <div class="grid-3">
                <div class="card glass-panel">
                    <h3 id="stat-total" style="font-size: 24px; font-weight: 700;">0</h3>
                    <p style="font-size: 12px; color: var(--text-muted);">TOTAL REGISTERED</p>
                </div>
                <div class="card glass-panel">
                    <h3 id="stat-active" style="font-size: 24px; font-weight: 700; color: var(--success);">0</h3>
                    <p style="font-size: 12px; color: var(--text-muted);">ACTIVE SYSTEMS</p>
                </div>
                <div class="card glass-panel">
                    <h3 id="stat-revoked" style="font-size: 24px; font-weight: 700; color: var(--danger);">0</h3>
                    <p style="font-size: 12px; color: var(--text-muted);">REVOKED / EXPIRED</p>
                </div>
            </div>

            <div class="glass-panel table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>System UUID</th>
                            <th>Device Name</th>
                            <th>Status</th>
                            <th>Expiry</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="glass-panel modal-card">
            <h3 style="margin-bottom: 20px; font-size: 18px;"><i class="fa-solid fa-plus-circle" style="color: var(--primary);"></i> Authorize System</h3>
            
            <div class="form-group">
                <label class="form-label">System UUID</label>
                <input type="text" id="new-uuid" class="form-input no-icon" placeholder="e.g. 4C4C4544-0059..." style="font-family: 'Fira Code';">
            </div>
            
            <div class="form-group">
                <label class="form-label">Device / User Name</label>
                <input type="text" id="new-name" class="form-input no-icon" placeholder="e.g. My_PC">
            </div>
            
            <div class="form-group">
                <label class="form-label">Access Duration</label>
                <select id="new-days" class="form-input no-icon" style="cursor: pointer;">
                    <option value="1">1 Day</option>
                    <option value="7">7 Days</option>
                    <option value="30" selected>30 Days</option>
                    <option value="365">1 Year</option>
                    <option value="0">Lifetime (No Expiry)</option>
                </select>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">Cancel</button>
                <button class="btn btn-primary" onclick="saveUuid()" style="flex: 1;">Authorize</button>
            </div>
        </div>
    </div>

    <div id="toast">Saved successfully!</div>

    <script>
        let uuids = [];

        // Check login session
        if (localStorage.getItem('admin_session') === 'true') {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'flex';
            loadData();
        }

        function login() {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            if (u === 're4per' && p === 're4per123') {
                localStorage.setItem('admin_session', 'true');
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'flex';
                loadData();
            } else {
                showToast('Invalid Credentials', 'var(--danger)');
            }
        }

        function logout() {
            localStorage.removeItem('admin_session');
            location.reload();
        }

        function showToast(msg, color = 'var(--primary)') {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.borderColor = color;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // Load Data from Vercel Blob
        async function loadData() {
            try {
                const res = await fetch('/api/keys');
                if (res.ok) uuids = await res.json();
            } catch(e) { showToast('Failed to load DB', 'var(--danger)'); }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            let active = 0, revoked = 0;

            if (uuids.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 30px; color: var(--text-muted);">No systems registered. Add one above.</td></tr>';
            } else {
                uuids.forEach((item, idx) => {
                    if (item.status === 'Active') active++; else revoked++;
                    
                    tbody.innerHTML += `
                        <tr>
                            <td><span class="key-value">${item.uuid}</span></td>
                            <td style="font-weight: 600;">${item.user}</td>
                            <td><span class="status-pill ${item.status.toLowerCase()}"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> ${item.status}</span></td>
                            <td style="font-size: 13px;">${item.expiresFormatted || 'Lifetime'}</td>
                            <td>
                                <button class="icon-btn" onclick="toggleStatus(${idx})" title="Toggle Status"><i class="fa-solid fa-rotate"></i></button>
                                <button class="icon-btn" onclick="deleteUuid(${idx})" style="color: var(--danger);" title="Delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('stat-total').innerText = uuids.length;
            document.getElementById('stat-active').innerText = active;
            document.getElementById('stat-revoked').innerText = revoked;
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function saveUuid() {
            const uuid = document.getElementById('new-uuid').value.trim().toUpperCase();
            const name = document.getElementById('new-name').value.trim();
            const days = parseInt(document.getElementById('new-days').value);
            
            if (!uuid || !name) return showToast('Fill all fields', 'var(--danger)');

            let expiresFormatted = "Lifetime";
            let expireTimestamp = 0;

            if (days > 0) {
                const expDate = new Date(Date.now() + days * 86400000);
                expiresFormatted = expDate.toLocaleDateString() + ' ' + expDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                expireTimestamp = Math.floor(expDate.getTime() / 1000);
            }

            const newObj = { 
                uuid: uuid, 
                user: name, 
                status: 'Active',
                durationDays: days,
                expireTimestamp: expireTimestamp,
                expiresFormatted: expiresFormatted
            };

            const idx = uuids.findIndex(x => x.uuid === uuid);
            if (idx !== -1) uuids[idx] = newObj;
            else uuids.unshift(newObj);

            await syncCloud();
            renderTable();
            closeModal();
            showToast('UUID Authorized Successfully!', 'var(--success)');
        }

        async function toggleStatus(idx) {
            uuids[idx].status = uuids[idx].status === 'Active' ? 'Revoked' : 'Active';
            await syncCloud();
            renderTable();
        }

        async function deleteUuid(idx) {
            if (!confirm('Permanently delete this UUID?')) return;
            uuids.splice(idx, 1);
            await syncCloud();
            renderTable();
        }

        async function syncCloud(notify = false) {
            try {
                const res = await fetch('/api/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save_all', keys: uuids })
                });
                if (!res.ok) throw new Error("Failed");
                if (notify) showToast('Saved to Vercel Blob!', 'var(--success)');
            } catch(e) { 
                showToast('Saved locally, but cloud failed.', 'var(--danger)'); 
            }
        }
    </script>
</body>
</html>
